<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Hub - GCP Minecraft On-Demand</title>
    <meta name="description" content="Check server status, copy connection details, and request whitelisting for the on-demand Minecraft server.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container directory-container fade-in">
        <!-- Back to Project Landing -->
        <div class="back-link-wrapper">
            <a href="index.html" class="back-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Project Landing
            </a>
        </div>

        <!-- Left Sidebar: Server List -->
        <div class="directory-panel directory-left">
            <div class="panel-title-group">
                <h3 class="panel-title">Servers Directory</h3>
                <a href="admin.html" class="btn btn-primary btn-mini text-no-decoration">⚙️ Admin</a>
            </div>
            <div class="search-wrapper">
                <input type="text" id="search-input" class="search-input" placeholder="🔍 Search servers..." autocomplete="off">
            </div>
            <div class="server-list-scroll" id="server-list">
                <!-- Dynamically populated -->
            </div>
            <div class="directory-buttons panel-action-footer">
                <button type="button" id="add-btn" class="btn btn-secondary flex-1">➕ Add Server</button>
                <button type="button" id="refresh-btn" class="btn btn-primary flex-1">🔄 Refresh All</button>
            </div>
        </div>

        <!-- Right Panel: Details -->
        <div class="directory-panel directory-right" id="details-panel">
            <div class="empty-state">
                <div class="empty-state-icon">🎮</div>
                <p class="empty-state-text">Select a server from the directory list to view connection details, check status, or request whitelist access.</p>
            </div>
        </div>
    </main>

    <!-- Modals -->
    <!-- Add Server Modal -->
    <div id="add-modal" class="wood-modal hidden">
        <div class="wood-modal-content">
            <div class="wood-modal-header">
                <h3>Add Custom Server</h3>
            </div>
            <form id="add-form" class="wood-modal-body">
                <div class="form-field">
                    <label for="add-name-input">Server Name *</label>
                    <input type="text" id="add-name-input" required autocomplete="off">
                </div>
                <div class="form-field">
                    <label for="add-domain-input">Connection Address (IP/Domain) *</label>
                    <input type="text" id="add-domain-input" required autocomplete="off">
                </div>
                <div class="form-field">
                    <label for="add-desc-input">Short Description</label>
                    <input type="text" id="add-desc-input" autocomplete="off">
                </div>
                <div class="form-field">
                    <label for="add-api-input">Status API URL (Optional)</label>
                    <input type="url" id="add-api-input" autocomplete="off" placeholder="For GCP On-Demand servers">
                </div>
                <div id="add-modal-alert" class="modal-alert hidden"></div>
                <div class="directory-buttons mt-2">
                    <button type="submit" class="btn btn-secondary btn-med">Add Server</button>
                    <button type="button" id="close-add-btn" class="btn btn-primary btn-med">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Server Modal -->
    <div id="edit-modal" class="wood-modal hidden">
        <div class="wood-modal-content">
            <div class="wood-modal-header">
                <h3>Edit Custom Server</h3>
            </div>
            <form id="edit-form" class="wood-modal-body">
                <input type="hidden" id="edit-id-input">
                <div class="form-field">
                    <label for="edit-name-input">Server Name *</label>
                    <input type="text" id="edit-name-input" required autocomplete="off">
                </div>
                <div class="form-field">
                    <label for="edit-domain-input">Connection Address (IP/Domain) *</label>
                    <input type="text" id="edit-domain-input" required autocomplete="off">
                </div>
                <div class="form-field">
                    <label for="edit-desc-input">Short Description</label>
                    <input type="text" id="edit-desc-input" autocomplete="off">
                </div>
                <div class="form-field">
                    <label for="edit-api-input">Status API URL (Optional)</label>
                    <input type="url" id="edit-api-input" autocomplete="off">
                </div>
                <div id="edit-modal-alert" class="modal-alert hidden"></div>
                <div class="directory-buttons mt-2">
                    <button type="submit" class="btn btn-secondary btn-med">Save Changes</button>
                    <button type="button" id="close-edit-btn" class="btn btn-primary btn-med">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Global Toast Alert (Woodland styled) -->
    <div id="global-toast" class="dir-alert-toast hidden"></div>

    <!-- Script that loads our GCP Primary Server Config -->
    <script src="js/config.js"></script>

    <script src="js/play.js"></script>
</body>
</html>
