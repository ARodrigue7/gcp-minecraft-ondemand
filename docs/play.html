<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>GCP Minecraft On-Demand - Player Portal</title>
    <meta name="description" content="Check server status, copy connection details, and request whitelisting for the on-demand Minecraft server.">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;family=JetBrains+Mono:wght@500;600&amp;family=Be+Vietnam+Pro:wght@400;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="js/theme.js"></script>
    <link href="css/style.css" rel="stylesheet"/>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen selection:bg-gold-accent selection:text-black">
    <div id="global-navbar" data-active-tab="servers"></div>

    <!-- Persistent Back Link Row (Resolves the bug where the back button disappears) -->
    <div class="max-w-container-max mx-auto px-margin pt-4">
        <a href="index.html" class="inline-flex items-center gap-2 text-primary hover:text-gold-accent font-label-lg uppercase transition-colors">
            <span class="material-symbols-outlined text-sm">arrow_back</span>
            Project Landing
        </a>
    </div>

    <!-- Main Grid Content -->
    <main class="max-w-container-max mx-auto px-margin py-base grid grid-cols-1 md:grid-cols-12 gap-gutter mt-2 mb-24">
        <!-- Left Column: Servers Directory -->
        <aside class="md:col-span-4 space-y-6">
            <div class="stone-card p-6 flex flex-col gap-4">
                <div class="flex justify-between items-center">
                    <h2 class="font-headline-lg text-headline-lg-mobile text-white uppercase tracking-tight">Servers</h2>
                    <a href="admin.html" class="wood-button px-3 py-1 flex items-center gap-1 text-no-decoration text-white font-label-lg text-label-lg">
                        <span class="material-symbols-outlined text-sm">settings</span>
                        <span>ADMIN</span>
                    </a>
                </div>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
                    <input id="search-input" class="input-field w-full pl-10 font-label-lg" placeholder="Search servers..." type="text"/>
                </div>
                <!-- Server list scroll container -->
                <div class="flex flex-col gap-3 max-h-[600px] overflow-y-auto pr-2" id="server-list">
                    <!-- Dynamically populated by play.js -->
                </div>
                <div class="grid grid-cols-2 gap-3 pt-4 border-t-2 border-on-secondary-fixed-variant">
                    <button id="add-btn" class="wood-button w-full py-3 flex items-center justify-center gap-2 text-white">
                        <span class="material-symbols-outlined">add</span>
                        <span class="font-label-lg text-label-lg uppercase">Add</span>
                    </button>
                    <button id="refresh-btn" class="bg-surface-variant text-on-surface border-b-4 border-surface-container-high w-full py-3 flex items-center justify-center gap-2 hover:bg-surface-bright transition-all">
                        <span class="material-symbols-outlined">refresh</span>
                        <span class="font-label-lg text-label-lg uppercase">Refresh</span>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Right Column: Detail View & Dynamic Bento Grid -->
        <section class="md:col-span-8 space-y-6" id="details-panel">
            <!-- Dynamically populated by play.js -->
            <div class="stone-card p-margin flex flex-col items-center justify-center text-center py-20">
                <div class="w-16 h-16 bg-surface-container-high pixel-card flex items-center justify-center mb-6">
                    <span class="material-symbols-outlined text-4xl text-primary animate-pulse">sports_esports</span>
                </div>
                <p class="font-title-md text-on-surface max-w-sm">
                    Select a server from the directory list to view connection details, check status, or request whitelist access.
                </p>
            </div>
        </section>
    </main>

    <!-- Modals -->
    <!-- Add Server Modal -->
    <div id="add-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm hidden">
        <div class="stone-card w-full max-w-md p-6 flex flex-col gap-4 m-4">
            <div class="flex justify-between items-center border-b-2 border-on-secondary-fixed-variant pb-2">
                <h3 class="font-headline-lg text-title-md text-white uppercase">Add Custom Server</h3>
            </div>
            <form id="add-form" class="flex flex-col gap-4">
                <div class="space-y-1">
                    <label for="add-name-input" class="block font-label-lg text-on-surface-variant uppercase">Server Name *</label>
                    <input type="text" id="add-name-input" class="input-field w-full font-label-lg" required autocomplete="off">
                </div>
                <div class="space-y-1">
                    <label for="add-domain-input" class="block font-label-lg text-on-surface-variant uppercase">Connection Address *</label>
                    <input type="text" id="add-domain-input" class="input-field w-full font-label-lg" required autocomplete="off">
                </div>
                <div class="space-y-1">
                    <label for="add-desc-input" class="block font-label-lg text-on-surface-variant uppercase">Short Description</label>
                    <input type="text" id="add-desc-input" class="input-field w-full font-label-lg" autocomplete="off">
                </div>
                <div class="space-y-1">
                    <label for="add-api-input" class="block font-label-lg text-on-surface-variant uppercase">Status API URL (Optional)</label>
                    <input type="url" id="add-api-input" class="input-field w-full font-label-lg" autocomplete="off" placeholder="https://...">
                </div>
                <div class="grid grid-cols-2 gap-3 pt-4 border-t-2 border-on-secondary-fixed-variant/50">
                    <button type="submit" class="wood-button w-full py-3 flex items-center justify-center gap-2 text-white">
                        <span class="font-label-lg text-label-lg uppercase">Add Server</span>
                    </button>
                    <button type="button" id="close-add-btn" class="bg-surface-variant text-on-surface border-b-4 border-surface-container-high w-full py-3 flex items-center justify-center hover:bg-surface-bright transition-all">
                        <span class="font-label-lg text-label-lg uppercase">Cancel</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Server Modal -->
    <div id="edit-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm hidden">
        <div class="stone-card w-full max-w-md p-6 flex flex-col gap-4 m-4">
            <div class="flex justify-between items-center border-b-2 border-on-secondary-fixed-variant pb-2">
                <h3 class="font-headline-lg text-title-md text-white uppercase">Edit Custom Server</h3>
            </div>
            <form id="edit-form" class="flex flex-col gap-4">
                <input type="hidden" id="edit-id-input">
                <div class="space-y-1">
                    <label for="edit-name-input" class="block font-label-lg text-on-surface-variant uppercase">Server Name *</label>
                    <input type="text" id="edit-name-input" class="input-field w-full font-label-lg" required autocomplete="off">
                </div>
                <div class="space-y-1">
                    <label for="edit-domain-input" class="block font-label-lg text-on-surface-variant uppercase">Connection Address *</label>
                    <input type="text" id="edit-domain-input" class="input-field w-full font-label-lg" required autocomplete="off">
                </div>
                <div class="space-y-1">
                    <label for="edit-desc-input" class="block font-label-lg text-on-surface-variant uppercase">Short Description</label>
                    <input type="text" id="edit-desc-input" class="input-field w-full font-label-lg" autocomplete="off">
                </div>
                <div class="space-y-1">
                    <label for="edit-api-input" class="block font-label-lg text-on-surface-variant uppercase">Status API URL (Optional)</label>
                    <input type="url" id="edit-api-input" class="input-field w-full font-label-lg" autocomplete="off">
                </div>
                <div class="grid grid-cols-2 gap-3 pt-4 border-t-2 border-on-secondary-fixed-variant/50">
                    <button type="submit" class="wood-button w-full py-3 flex items-center justify-center gap-2 text-white">
                        <span class="font-label-lg text-label-lg uppercase">Save</span>
                    </button>
                    <button type="button" id="close-edit-btn" class="bg-surface-variant text-on-surface border-b-4 border-surface-container-high w-full py-3 flex items-center justify-center hover:bg-surface-bright transition-all">
                        <span class="font-label-lg text-label-lg uppercase">Cancel</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Global Toast Alert -->
    <div id="global-toast" class="hidden"></div>

    <!-- Config scripts -->
    <script src="js/config.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/play.js"></script>
</body>
</html>
