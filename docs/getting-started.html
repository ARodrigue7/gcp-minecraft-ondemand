<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Getting Started - GCP Minecraft On-Demand</title>
    <meta name="description" content="Deployment guides and documentation for the GCP Minecraft On-Demand stack.">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="js/theme.js"></script>
    <link href="css/style.css" rel="stylesheet"/>
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen selection:bg-gold-accent selection:text-black">
    <!-- TopNavBar Container -->
    <div id="global-navbar" data-active-tab="getting-started"></div>

    <main class="min-h-[calc(100vh-56px)] flex items-start justify-center pt-8 pb-28 md:py-12 px-4">
        <!-- Tactical Panel for Wiki Docs -->
        <div class="tactical-panel w-full max-w-4xl p-6 md:p-8 relative">
            <!-- Minimal Corner Accents -->
            <div class="absolute top-0 left-0 w-2 h-2 border-t border-l border-gold-accent"></div>
            <div class="absolute top-0 right-0 w-2 h-2 border-t border-r border-gold-accent"></div>
            <div class="absolute bottom-0 left-0 w-2 h-2 border-b border-l border-gold-accent"></div>
            <div class="absolute bottom-0 right-0 w-2 h-2 border-b border-r border-gold-accent"></div>
            
            <div class="flex items-center justify-between border-b border-white/10 pb-4 mb-6">
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary">description</span>
                    <h1 class="font-headline-lg text-lg md:text-xl text-primary uppercase tracking-wider leading-none">GETTING STARTED</h1>
                </div>
                <div class="text-right">
                    <span class="text-[9px] font-label-sm text-on-surface-variant uppercase tracking-widest">Source: tutorial.md</span>
                </div>
            </div>

            <!-- Scrollable Docs Reader -->
            <div id="docs-content" class="markdown-body h-[60vh] overflow-y-auto pr-4 select-text">
                <div class="flex items-center justify-center h-full">
                    <div class="text-center space-y-3">
                        <span class="material-symbols-outlined animate-spin text-primary text-3xl">autorenew</span>
                        <p class="font-label-sm text-on-surface-variant uppercase tracking-widest">Loading Wiki Content...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/navbar.js"></script>
    <script>
        // Global toggle function for interactive DNS instructions
        window.showDnsInstructions = function(provider) {
            // Hide all instructions
            document.querySelectorAll(".dns-instruct-pane").forEach(pane => {
                pane.classList.add("hidden");
            });
            // Show target instructions
            const activePane = document.getElementById("dns-instructions-" + provider);
            if (activePane) {
                activePane.classList.remove("hidden");
            }
            // Reset tab highlights
            document.querySelectorAll(".dns-tab-btn").forEach(btn => {
                btn.className = "dns-tab-btn px-3 py-1.5 text-xs border border-white/10 text-on-surface-variant uppercase transition-all duration-200";
            });
            // Highlight active tab
            const activeBtn = document.getElementById("dns-btn-" + provider);
            if (activeBtn) {
                activeBtn.className = "dns-tab-btn active px-3 py-1.5 text-xs border border-primary text-primary font-bold uppercase transition-all duration-200 bg-primary/5";
            }
        };

        document.addEventListener("DOMContentLoaded", function() {
            const contentContainer = document.getElementById("docs-content");
            
            fetch("tutorial.md")
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Failed to load documentation file");
                    }
                    return response.text();
                })
                .then(markdownText => {
                    // Set marked options for security
                    marked.setOptions({
                        headerIds: true,
                        gfm: true,
                        breaks: true
                    });
                    contentContainer.innerHTML = marked.parse(markdownText);
                })
                .catch(error => {
                    console.error("Docs load error:", error);
                    contentContainer.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full text-error text-center space-y-4">
                            <span class="material-symbols-outlined text-4xl">error</span>
                            <div>
                                <h3 class="font-headline-lg text-base uppercase">Load Failure</h3>
                                <p class="font-body-md text-xs mt-1 text-on-surface-variant">Could not load the tutorial.md file. Check if it exists in the docs folder.</p>
                            </div>
                        </div>
                    `;
                });
        });
    </script>
</body>
</html>
